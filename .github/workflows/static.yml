# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Triggar igång vid push till main
  push:
    branches: ["main"]
    # VIKTIGT FÖR DIN WEBBPLATS: 
    # Detta förhindrar att sidan hamnar i en loop eller bygger om i onödan 
    # när sitemapen eller din automatiserade Python-data uppdateras.
    paths-ignore:
      - 'sitemap.xml'
      - 'data/**'        # Ändra till den mapp där din Python-motor sparar sin data (t.ex. CSV-filer)
      - '**.csv'         # Ignorerar alla CSV-filer om de ligger löst

  # Tillåter att köra detta workflow manuellt från Actions-fliken
  workflow_dispatch:

# Sätter rättigheter för GITHUB_TOKEN så att vi kan skriva sitemapen och driftsätta till Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Tillåt endast en pågående driftsättning åt gången
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 behövs för att sitemap-generatorn ska kunna läsa ändringsdatum (lastmod) för filerna
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://dalmanium.se/
          path-to-root: '.'
          include-html: true
          sitemap-format: xml

      - name: Commit and push sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f sitemap.xml ]; then
            git add sitemap.xml
            # [skip ci] talar om för GitHub att INTE starta ett nytt bygge för denna commit
            git commit -m "Automated sitemap update [skip ci]" || echo "No changes to commit"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
