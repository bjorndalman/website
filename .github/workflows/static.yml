name: Update Sitemap and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run if a new commit is pushed
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository with full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap.xml
        run: |
          BASE_URL="https://dalmanium.se"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'

            # Find all .html and .pdf files, excluding .git and hidden folders
            find . -type f \( -name "*.html" -o -name "*.pdf" \) \
              -not -path '*/.*' | sort | while read -r file; do

              # Convert ./index.html -> / and ./sv/index.html -> /sv/
              rel_path="${file#./}"
              url_path="/${rel_path}"
              url_path="${url_path%/index.html}"
              [[ -z "$url_path" ]] && url_path="/"
              [[ "$rel_path" == */index.html ]] && url_path="${url_path}/"

              # Get last commit date for the file in ISO 8601 format
              lastmod=$(git log -1 --format="%cI" -- "$file")
              [[ -z "$lastmod" ]] && lastmod=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

              echo "  <url>"
              echo "    <loc>${BASE_URL}${url_path}</loc>"
              echo "    <lastmod>${lastmod}</lastmod>"
              echo "  </url>"
            done

            echo '</urlset>'
          } > sitemap.xml

      - name: Commit and push updated sitemap.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if ! git diff --staged --quiet; then
            git commit -m "chore: update sitemap.xml [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
