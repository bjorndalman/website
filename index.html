<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 transition-colors duration-300">

    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            
            <a href="index.html" class="flex items-center gap-2">
                <div class="h-10 w-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">BD</div>
                <span class="font-bold hidden sm:block">Björn Dahlman</span>
            </a>
            
            <div class="flex items-center gap-6">
                <ul id="main-nav" class="hidden md:flex gap-6 text-sm font-medium text-slate-600 dark:text-slate-400">
                    <li><a href="#about" class="hover:text-blue-600 dark:hover:text-blue-400 transition">About</a></li>
                    <li><a href="#skills" class="hover:text-blue-600 dark:hover:text-blue-400 transition">Skills</a></li>
                    <li><a href="projects.html" class="hover:text-blue-600 dark:hover:text-blue-400 transition">Projects</a></li>
                    <li><a href="#experience" class="hover:text-blue-600 dark:hover:text-blue-400 transition">Experience</a></li>
                </ul>

                <div class="flex items-center gap-4 border-l pl-6 border-slate-200 dark:border-slate-700">
                    <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                        <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                    </button>
                    
                    <div class="flex items-center gap-2">
                        <a href="index.html" class="opacity-100" title="English">🇬🇧</a>
                        <a href="sv/index.html" class="opacity-50 hover:opacity-100 transition" title="Svenska">🇸🇪</a>
                    </div>

                    <button id="menu-button" class="p-2 md:hidden transition">
                        <i data-lucide="menu" id="menu-icon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <nav id="mobile-menu" class="fixed top-[72px] left-0 right-0 z-40 hidden bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 md:hidden">
        <div class="flex flex-col p-6 space-y-4">
            <a href="#about" onclick="toggleMenu()" class="text-lg">About</a>
            <a href="#skills" onclick="toggleMenu()" class="text-lg">Skills</a>
            <a href="projects.html" class="text-lg">Projects</a>
            <a href="#experience" onclick="toggleMenu()" class="text-lg">Experience</a>
        </div>
    </nav>

    <header class="hero-bg relative text-white text-center py-40 px-6">
        <div class="relative z-10 max-w-3xl mx-auto">
            <h1 class="text-5xl md:text-7xl font-bold mb-4 tracking-tight">Björn Dahlman</h1>
            <p class="text-xl md:text-2xl text-slate-200 font-light mb-8">Fullstack Developer & Creative Mind</p>
            
            <div class="flex justify-center gap-4">
                <a href="#contact" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-full font-medium transition shadow-lg">
                    Contact Me
                </a>
                <a href="projects.html" class="bg-white/10 hover:bg-white/20 backdrop-blur-sm border border-white/30 text-white px-8 py-3 rounded-full font-medium transition">
                    View Projects
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 space-y-32 py-20">
        <section id="about" class="grid md:grid-cols-3 gap-12 items-start">
             <div class="md:col-span-1">
                <h3 class="text-2xl font-bold flex items-center gap-2">
                    <i data-lucide="user" class="text-blue-600"></i> About
                </h3>
            </div>
            <div class="md:col-span-2 text-lg text-slate-600 dark:text-slate-300">
                <p>Här skriver du din presentation direkt i HTML om du inte hämtar den via JS.</p>
            </div>
        </section>
    </main>

    <script>
        // Grundläggande script för att sidan ska fungera direkt
        lucide.createIcons();

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        const menuBtn = document.getElementById('menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // Enkel animation vid scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('section').forEach(section => {
            section.classList.add('fade-in');
            observer.observe(section);
        });
    </script>
</body>
</html>
